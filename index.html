
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRM Testing — Kinescope</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a1a;
      color: #eee;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1rem;
    }
    .frame-wrap {
      background: #252525;
      border-radius: 8px;
      overflow: hidden;
    }
    .frame-wrap h2 {
      margin: 0;
      padding: 0.5rem 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      background: #2d2d2d;
    }
    .frame-wrap iframe {
      display: block;
      width: 100%;
      height: 280px;
      border: none;
    }
  </style>
</head>
<body>
  <h1>DRM Testing</h1>
  <div class="grid">
    <div class="frame-wrap">
      <h2>Previous version</h2>
      <iframe src="https://kinescope.io/e8d7d106-7af0-4a25-87d8-c4c748b62e3f?v=2.172.0" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; screen-wake-lock;" frameborder="0" allowfullscreen ></iframe>
    </div>
    <div class="frame-wrap">
      <h2>New version</h2>
      <iframe src="https://kinescope.io/e8d7d106-7af0-4a25-87d8-c4c748b62e3f?v=2.179.9" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; screen-wake-lock;" frameborder="0" allowfullscreen ></iframe>
    </div>
  </div>
  <div class="grid">
    <div class="frame-wrap">
      <h2>Clearkey Previous version</h2>
      <iframe src="https://kinescope.io/iVv6uEZ5V3DZ2ytZ28RUru?v=2.172.0" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; screen-wake-lock;" frameborder="0" allowfullscreen ></iframe>
    </div>
    <div class="frame-wrap">
      <h2>Clearkey New version</h2>
      <iframe src="https://kinescope.io/iVv6uEZ5V3DZ2ytZ28RUru?v=2.179.9" allow="autoplay; fullscreen; picture-in-picture; encrypted-media; gyroscope; accelerometer; clipboard-write; screen-wake-lock;" frameborder="0" allowfullscreen ></iframe>
    </div>
  </div>
</body>
</html>
